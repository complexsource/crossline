<!doctype html>
<html>
  <body>
    <p>Crossline original asset compiler</p>
    <script type="module">
      import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
      import { weaponModel } from "../src/weapon-models.js";
      import {
        characterModel,
        characterClips,
      } from "../src/character-models.js";
      import { materialsReady } from "../src/materials.js";
      await materialsReady;
      window.compileAsset = async (id) => {
        const character = ["soldier", "terrorist"].includes(id),
          model = character
            ? characterModel(id === "soldier" ? "soldiers" : "terrorists")
            : weaponModel(id);
        // Runtime handles are not GLTF extras. Named joints survive in the exported asset.
        model.traverse((o) => {
          o.userData = {};
        });
        const data = await new GLTFExporter().parseAsync(model, {
          binary: true,
          onlyVisible: true,
          animations: character ? characterClips() : [],
        });
        const bytes = new Uint8Array(data);
        let binary = "";
        for (let i = 0; i < bytes.length; i += 8192)
          binary += String.fromCharCode(...bytes.subarray(i, i + 8192));
        return btoa(binary);
      };
      window.ready = true;
    </script>
  </body>
</html>
