<!doctype html>
<html>
  <head>
    <link rel="icon" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        background: #183d44;
      }
      canvas {
        display: block;
      }
      #label {
        position: fixed;
        left: 30px;
        top: 24px;
        color: #e9ecd9;
        font: 600 16px Arial;
        letter-spacing: 2px;
        pointer-events: none;
        text-shadow: 0 1px 4px #000;
      }
    </style>
  </head>
  <body>
    <div id="label">COASTLINE / V2</div>
    <canvas id="game"></canvas>
    <script type="module">
      import * as THREE from "three";
      import { Renderer } from "../src/renderer.js";
      import { loadAssets } from "../src/assets.js";
      import {
        makePlayer,
        makeGun,
        animatePlayer,
        animateGun,
      } from "../src/models.js";
      import { materialsReady } from "../src/materials.js";
      await Promise.all([loadAssets(), materialsReady]);
      const r = new Renderer(document.querySelector("canvas"));
      r.setQuality("high");
      const mapFog = r.scene.fog;
      window.graphics = r;
      const studio = new THREE.Group();
      studio.add(new THREE.HemisphereLight(0xe0f0f6, 0x263c3b, 0.8));
      const key = new THREE.DirectionalLight(0xffe1b7, 3.2);
      key.position.set(-3, 5, -4);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.normalBias = 0.018;
      key.shadow.bias = -0.00015;
      Object.assign(key.shadow.camera, {
        left: -3,
        right: 3,
        top: 3,
        bottom: -3,
        near: 0.1,
        far: 15,
      });
      studio.add(key);
      const rim = new THREE.DirectionalLight(0x9bcee8, 2.2);
      rim.position.set(3, 3, 2);
      studio.add(rim);
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(30, 30),
        new THREE.MeshStandardMaterial({ color: 0x235b60, roughness: 0.7 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.012;
      floor.receiveShadow = true;
      studio.add(floor);
      r.scene.add(studio);
      let subject;
      window.sample = async ({
        mode = "map",
        weapon = "ak47",
        team = "soldiers",
        quality = "high",
        reload = 0,
        site = "mid",
        pose = "idle",
      } = {}) => {
        if (subject) {
          subject.removeFromParent();
          subject = null;
        }
        r.setQuality(quality);
        r.world.root.visible = mode === "map";
        studio.visible = mode !== "map";
        floor.visible = mode === "character";
        r.scene.fog = mode === "map" ? mapFog : null;
        r.scene.background = new THREE.Color(0x235b60);
        r.camera.fov = 40;
        r.camera.updateProjectionMatrix();
        if (mode === "map") {
          if (site === "aerial") {
            r.menuCamera();
          } else if (site === "hero") {
            r.camera.fov = 49;
            r.camera.updateProjectionMatrix();
            r.camera.position.set(44, 25, 50);
            r.camera.lookAt(-3, 3.5, -6);
          } else {
            const views = {
              mid: [-7, 1.68, 12, 0, 2, -7],
              a: [-36, 1.68, -22, -21, 2, -11],
              b: [35, 1.68, -22, 20, 2, -11],
              market: [-34, 1.68, 27, -13, 2, 16],
              water: [0, 0.32, 9, 0, 1, -6],
              roof: [-28, 6.2, -7, 0, 3, -20],
            };
            const v = views[site];
            r.camera.position.set(...v.slice(0, 3));
            r.camera.lookAt(...v.slice(3));
          }
        } else {
          subject =
            mode === "character"
              ? makePlayer("CROSSLINE", team)
              : makeGun(weapon);
          r.scene.add(subject);
          if (mode === "character") {
            subject.userData.label.visible = false;
            subject.rotation.y = -0.13;
            r.camera.position.set(-1.6, 1.36, -3.25);
            r.camera.lookAt(0, 1.03, 0);
            if (pose !== "idle") {
              const u = subject.userData;
              u.gun = makeGun(weapon);
              u.weapon = weapon;
              u.weaponPivot.add(u.gun);
              const state = {
                vx: 0,
                vz: 0,
                yaw: 0,
                pitch: 0,
                hp: 100,
                grounded: true,
                crouch: pose === "crouch",
                weapon,
                reload,
                action: pose,
                actionTime: pose === "throw" ? 0.35 : 0,
              };
              for (let frame = 0; frame < 60; frame++)
                animatePlayer(subject, state, frame / 60, 1 / 60);
              subject.userData.label.visible = false;
            }
          } else {
            r.camera.position.set(-1.8, 0.63, -1.5);
            r.camera.lookAt(0, 0, -0.08);
            animateGun(subject, weapon, reload, 0.1);
          }
        }
        r.world.update(6);
        r.renderer.shadowMap.needsUpdate = true;
        r.renderer.render(r.scene, r.camera);
        await new Promise((resolve) => requestAnimationFrame(resolve));
        r.renderer.info.reset();
        r.renderer.render(r.scene, r.camera);
        document.querySelector("#label").textContent =
          mode === "map"
            ? `COASTLINE / ${site.toUpperCase()}`
            : mode === "character"
              ? team.toUpperCase()
              : weapon.toUpperCase();
        return {
          calls: r.renderer.info.render.calls,
          triangles: r.renderer.info.render.triangles,
        };
      };
      window.preview = async (mode) => {
        await window.sample(
          mode.startsWith("coastline")
            ? {
                mode: "map",
                site: mode === "coastline-hero" ? "hero" : "aerial",
              }
            : {
                mode: "character",
                team: mode === "soldier" ? "soldiers" : "terrorists",
              },
        );
        const c = document.createElement("canvas");
        c.width = mode.startsWith("coastline") ? 1440 : 512;
        c.height = mode.startsWith("coastline") ? 900 : 512;
        const ctx = c.getContext("2d"),
          source = r.renderer.domElement;
        if (mode.startsWith("coastline"))
          ctx.drawImage(source, 0, 0, c.width, c.height);
        else {
          const side = source.height;
          ctx.drawImage(
            source,
            (source.width - side) / 2,
            0,
            side,
            side,
            0,
            0,
            512,
            512,
          );
        }
        return c.toDataURL("image/webp", 0.9);
      };
      window.animationCheck = () => {
        const m = makePlayer("Check", "soldiers"),
          state = {
            vx: 5,
            vz: 0,
            yaw: 0,
            pitch: 0,
            crouch: true,
            hp: 100,
            grounded: true,
            weapon: "ak47",
            action: "idle",
            reload: 0,
            actionTime: 0,
          };
        for (let i = 0; i < 60; i++) animatePlayer(m, state, i / 60, 1 / 60);
        const crouch = m.userData.body.position.y;
        for (let i = 0; i < 60; i++)
          animatePlayer(m, { ...state, hp: 0 }, i / 60, 1 / 60);
        const gun = makeGun("ak47");
        animateGun(gun, "ak47", 1.6, 0);
        // Idle has no weighted leg tracks. This is the important regression:
        // additive overlays must not reuse last frame's crouched joint pose.
        const idleCrouch = [];
        const names = [
          "body",
          "head",
          "arm0",
          "arm1",
          "elbow0",
          "elbow1",
          "leg0",
          "leg1",
          "knee0",
          "knee1",
          "ankle0",
          "ankle1",
          "weaponPivot",
        ];
        for (const team of ["soldiers", "terrorists"])
          for (const lowDetail of [false, true]) {
            const player = makePlayer("Pose regression", team, lowDetail);
            const nodes = names.map((name) => player.getObjectByName(name));
            const missing = names.filter((_, i) => !nodes[i]);
            if (missing.length) {
              idleCrouch.push({ team, lowDetail, missing });
              continue;
            }
            const stationary = { ...state, yaw: 0, vx: 0, vz: 0 };
            const legs = [0, 1].flatMap((i) => [
              player.getObjectByName(`leg${i}`),
              player.getObjectByName(`knee${i}`),
              player.getObjectByName(`ankle${i}`),
            ]);
            const feet = [0, 1].map((i) => player.getObjectByName(`ankle${i}`));
            const skinnedFeet = [[], []];
            player.traverse((mesh) => {
              if (!mesh.isSkinnedMesh) return;
              const weights = mesh.geometry.attributes.skinWeight;
              const joints = mesh.geometry.attributes.skinIndex;
              for (let v = 0; v < weights.count; v++)
                for (let side = 0; side < 2; side++) {
                  let weight = 0;
                  for (let k = 0; k < 4; k++)
                    if (
                      mesh.skeleton.bones[joints.getComponent(v, k)]?.name ===
                      `ankle${side}`
                    )
                      weight += weights.getComponent(v, k);
                  if (weight > 0.5) skinnedFeet[side].push({ mesh, v });
                }
            });
            const skinVertex = new THREE.Vector3();
            function soleHeight(foot, side) {
              if (!skinnedFeet[side].length)
                return new THREE.Box3().setFromObject(foot).min.y;
              let min = Infinity;
              for (const mesh of new Set(
                skinnedFeet[side].map((sample) => sample.mesh),
              ))
                mesh.skeleton.update();
              for (const { mesh, v } of skinnedFeet[side]) {
                mesh
                  .getVertexPosition(v, skinVertex)
                  .applyMatrix4(mesh.matrixWorld);
                min = Math.min(min, skinVertex.y);
              }
              return min;
            }
            const result = {
              team,
              lowDetail,
              missing,
              finite: true,
              maxRotation: 0,
              maxPosition: 0,
              maxQuaternionError: 0,
              maxLegDrift: 0,
              minFootY: Infinity,
              maxFootY: -Infinity,
              maxFootTilt: 0,
            };
            let baseline;
            const footBox = new THREE.Box3();
            const footQuaternion = new THREE.Quaternion();
            const up = new THREE.Vector3();
            for (let i = 0; i < 120; i++) {
              animatePlayer(player, stationary, i / 60, 1 / 60);
              player.updateMatrixWorld(true);
              for (const node of nodes) {
                const angles = [
                  node.rotation.x,
                  node.rotation.y,
                  node.rotation.z,
                ];
                const values = [
                  ...node.position.toArray(),
                  ...angles,
                  ...node.quaternion.toArray(),
                  ...node.scale.toArray(),
                  ...node.matrixWorld.elements,
                ];
                result.finite &&= values.every(Number.isFinite);
                result.maxRotation = Math.max(
                  result.maxRotation,
                  ...angles.map(Math.abs),
                );
                result.maxPosition = Math.max(
                  result.maxPosition,
                  ...node.position.toArray().map(Math.abs),
                );
                result.maxQuaternionError = Math.max(
                  result.maxQuaternionError,
                  Math.abs(node.quaternion.length() - 1),
                );
              }
              if (i < 59) continue;
              const angles = legs.flatMap((node) => [
                node.rotation.x,
                node.rotation.y,
                node.rotation.z,
              ]);
              baseline ||= angles;
              result.maxLegDrift = Math.max(
                result.maxLegDrift,
                ...angles.map((value, index) =>
                  Math.abs(value - baseline[index]),
                ),
              );
              for (const [side, foot] of feet.entries()) {
                const soleY = soleHeight(foot, side);
                result.minFootY = Math.min(result.minFootY, soleY);
                result.maxFootY = Math.max(result.maxFootY, soleY);
                foot.getWorldQuaternion(footQuaternion);
                up.set(0, 1, 0).applyQuaternion(footQuaternion);
                result.maxFootTilt = Math.max(result.maxFootTilt, 1 - up.y);
              }
            }
            result.bodyY = player.userData.body.position.y;
            for (let i = 0; i < 120; i++)
              animatePlayer(
                player,
                { ...stationary, crouch: false },
                2 + i / 60,
                1 / 60,
              );
            player.updateMatrixWorld(true);
            result.standingBodyY = player.userData.body.position.y;
            result.standingFootY = feet.map((foot, side) =>
              soleHeight(foot, side),
            );
            // Label textures are per-player; all GLB geometries remain shared.
            player.userData.labelTexture.dispose();
            player.userData.label.material.dispose();
            player.userData.mixer.stopAllAction();
            player.userData.mixer.uncacheRoot(player);
            idleCrouch.push(result);
          }
        return {
          crouch,
          death: m.userData.death,
          mag: gun.userData.magazines[0].position.y,
          idleCrouch,
        };
      };
      window.grenadePresentationCheck = () => {
        // Exercise the renderer's real presentation methods with inert stubs;
        // snapshots are frozen so cosmetic actions cannot change inventory.
        const snapshot = Object.freeze({
          id: "remote",
          hp: 100,
          spawnId: 4,
          weapon: "m4a4",
          inventory: Object.freeze({ primary: "m4a4", secondary: "glock18" }),
        });
        const original = JSON.stringify(snapshot);
        const render = { time: 10, remoteWeaponActions: new Map() };
        const action = (p = snapshot) =>
          Renderer.prototype.remoteWeaponAction.call(render, p);
        const install = (kind = "throw", weapon = "he", extra = {}) => {
          render.time = 10;
          render.remoteWeaponActions.set("remote", {
            kind,
            weapon,
            until: 10.42,
            ...extra,
          });
        };
        install();
        const grenadeThroughRifleSnapshot = action()?.weapon;
        const boundSpawn = render.remoteWeaponActions.get("remote")?.spawnId;
        render.time = 10.42;
        const expired =
          action() === null && render.remoteWeaponActions.size === 0;
        install();
        const dead =
          action(Object.freeze({ ...snapshot, hp: 0 })) === null &&
          render.remoteWeaponActions.size === 0;
        install("throw", "he", { spawnId: 4 });
        const respawn =
          action(Object.freeze({ ...snapshot, spawnId: 5 })) === null &&
          render.remoteWeaponActions.size === 0;
        install("shot", "m4a4", { spawnId: 4, until: 10.16 });
        const oldGrenadeSnapshot = Object.freeze({ ...snapshot, weapon: "he" });
        const shotBridge = action(oldGrenadeSnapshot)?.weapon;
        const caughtUp =
          action() === null && render.remoteWeaponActions.size === 0;
        install("shot", "m4a4", { spawnId: 4, until: 10.16 });
        render.time = 10.16;
        const shotExpired =
          action(oldGrenadeSnapshot) === null &&
          render.remoteWeaponActions.size === 0;
        const equips = [];
        const local = {
          time: 10,
          throwUntil: 10.42,
          throwWeapon: "he",
          weaponTeam: "terrorists",
          gun: null,
          camera: {
            position: new THREE.Vector3(),
            quaternion: new THREE.Quaternion(),
            rotation: { y: 0 },
          },
          setWeapon(id, team) {
            equips.push([id, team]);
          },
          casing() {},
        };
        Renderer.prototype.localShot.call(local, "m4a4");
        return {
          grenadeThroughRifleSnapshot,
          boundSpawn,
          expired,
          dead,
          respawn,
          shotBridge,
          caughtUp,
          shotExpired,
          snapshotUnchanged:
            JSON.stringify(snapshot) === original &&
            oldGrenadeSnapshot.weapon === "he",
          localCancelled: local.throwUntil === 0 && local.throwWeapon === null,
          localFlash: local.kick === 1 && local.flashUntil > local.time,
          equips,
        };
      };
      window.firstPerson = async (weapon, reload = 0, team = "soldiers") => {
        await window.sample({ site: "mid" });
        const state = {
          x: -7,
          y: 0,
          z: 9,
          yaw: 0.3,
          pitch: 0,
          vx: 0,
          vz: 0,
          hp: 100,
          grounded: true,
          crouch: false,
          team,
          weapon,
          reload,
          action: "idle",
          actionTime: 0,
          spawnId: 1,
        };
        for (let i = 0; i < 30; i++) r.render(1 / 60, state, true, false);
        return {
          calls: r.renderer.info.render.calls,
          triangles: r.renderer.info.render.triangles,
        };
      };
      window.benchmark = async (quality) => {
        await window.sample({ site: "a" });
        r.clearPlayers();
        r.setQuality(quality);
        const observer = { x: -21, z: -29 };
        const base = {
            y: 0,
            vx: 0,
            vy: 0,
            vz: 0,
            yaw: Math.PI,
            pitch: 0,
            crouch: false,
            grounded: true,
            hp: 100,
            weapon: "m4a4",
            reload: 0,
            action: "idle",
            actionTime: 0,
            spawnId: 1,
          },
          state = {
            players: Array.from({ length: 9 }, (_, i) => ({
              ...base,
              id: "bench" + i,
              name: "Player " + i,
              team: i % 2 ? "soldiers" : "terrorists",
              // Keep every body clear of the tall crate at (-31, -22).
              x: -29 + (i % 3) * 3,
              z: -20 - Math.floor(i / 3) * 3,
            })),
            grenades: [],
            drops: [],
            smokes: [],
          };
        const center = state.players.reduce(
          (sum, player) => ({
            x: sum.x + player.x / state.players.length,
            z: sum.z + player.z / state.players.length,
          }),
          { x: 0, z: 0 },
        );
        // Renderer uses Three's -Z forward convention: positive yaw looks west.
        const local = {
          ...base,
          ...observer,
          yaw: Math.atan2(observer.x - center.x, observer.z - center.z),
          pitch: -0.05,
        };
        for (const player of state.players)
          player.yaw = Math.atan2(player.x - observer.x, player.z - observer.z);
        r.camera.position.set(observer.x, 1.68, observer.z);
        r.sync(state, "self");
        const renderedThisFrame = new Set(),
          hooks = [];
        for (const [id, player] of r.players)
          player.traverse((mesh) => {
            if (!mesh.isSkinnedMesh) return;
            const original = mesh.onBeforeRender;
            hooks.push({ mesh, original });
            mesh.onBeforeRender = function (...args) {
              original.apply(this, args);
              // Ignore shadow passes and the separate first-person gun camera.
              if (args[2] === r.camera) renderedThisFrame.add(id);
            };
          });
        const times = [],
          calls = [],
          counts = [],
          submitTimes = [],
          idleTimes = [];
        const totalFrames = 480,
          warmupFrames = 60;
        let previous = performance.now();
        // Establish the browser's current animation cadence without submitting
        // rendering work. Host frame-pacing caps must not masquerade as GPU cost.
        for (let i = 0; i < 60; i++) {
          await new Promise(requestAnimationFrame);
          const now = performance.now();
          if (i > 5) idleTimes.push(now - previous);
          previous = now;
        }
        try {
          for (let i = 0; i < totalFrames; i++) {
            await new Promise((resolve) => requestAnimationFrame(resolve));
            const t = performance.now(),
              dt = (t - previous) / 1000;
            previous = t;
            renderedThisFrame.clear();
            r.render(Math.min(0.05, dt), local, true, false);
            if (i >= warmupFrames) {
              submitTimes.push(performance.now() - t);
              times.push(dt * 1000);
              calls.push(r.renderer.info.render.calls);
              counts.push(renderedThisFrame.size);
            }
          }
        } finally {
          for (const { mesh, original } of hooks)
            mesh.onBeforeRender = original;
        }
        const minRenderedAvatars = Math.min(...counts);
        if (minRenderedAvatars !== state.players.length)
          throw new Error(
            `Benchmark framed only ${minRenderedAvatars}/${state.players.length} character skins; timing is not a valid nine-player sample.`,
          );
        const sampleDurationMs = times.reduce((sum, value) => sum + value, 0);
        times.sort((a, b) => a - b);
        submitTimes.sort((a, b) => a - b);
        idleTimes.sort((a, b) => a - b);
        const gl = r.renderer.getContext(),
          debug = gl.getExtension("WEBGL_debug_renderer_info");
        return {
          quality,
          totalFrames,
          warmupFrames,
          measuredFrames: times.length,
          sampleDurationMs,
          expectedAvatars: state.players.length,
          minRenderedAvatars,
          maxRenderedAvatars: Math.max(...counts),
          framesWithAllAvatars: counts.filter(
            (count) => count === state.players.length,
          ).length,
          cameraPosition: r.camera.position.toArray(),
          cameraYaw: local.yaw,
          viewport: {
            width: innerWidth,
            height: innerHeight,
            pixelRatio: r.renderer.getPixelRatio(),
          },
          medianFrameMs: times[Math.floor(times.length * 0.5)],
          idleMedianFrameMs: idleTimes[Math.floor(idleTimes.length * 0.5)],
          medianSubmitMs: submitTimes[Math.floor(submitTimes.length * 0.5)],
          p95SubmitMs: submitTimes[Math.floor(submitTimes.length * 0.95)],
          p95FrameMs: times[Math.floor(times.length * 0.95)],
          meanDrawCalls: Math.round(
            calls.reduce((a, b) => a + b, 0) / calls.length,
          ),
          renderer: debug
            ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL)
            : "Unavailable",
        };
      };
      window.ready = true;
    </script>
  </body>
</html>
